# Professional-socials browser service policy.
#
# The static sections below are byte-identical to the safe authenticated-browser
# service policy, so switching a shared browser workspace between the two modes
# is a dynamic network change and never destroys the persistent login state.
#
# Egress is an explicit per-host allowlist generated from site-rules.json. There
# is no wildcard host and no other network client in this sandbox. The entries
# are opaque L4 endpoints because TLS to these sites cannot be inspected without
# breaking them; origin, surface, and action confinement is enforced by the
# rulebook in the host bridge and again in the browser controller.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
    - /opt
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /run/openshell-browser
    - /var/lib/openshell-browser
landlock:
  compatibility: best_effort
process:
  run_as_user: 2000
  run_as_group: 2000
network_policies:
  professional_socials:
    name: professional-socials
    endpoints:
      - host: assets.xingcdn.com
        port: 443
        enforcement: enforce
      - host: cdn.freelance.de
        port: 443
        enforcement: enforce
      - host: cdn.freelancermap.de
        port: 443
        enforcement: enforce
      - host: cdn.gulp.de
        port: 443
        enforcement: enforce
      - host: dam.malt.com
        port: 443
        enforcement: enforce
