# Safe authenticated-browser service policy.
#
# The static sections below are byte-identical to the professional-socials
# service policy, so switching a shared browser workspace between the two modes
# is a dynamic network change and never destroys the persistent login state.
#
# Manual login through noVNC needs the same bounded per-host allowlist that
# site-rules.json declares: a login page that cannot load its own CSS and
# JavaScript is unusable, and asking Policy Advisor for those hosts one denial
# at a time would widen the sandbox instead of bounding it. Safe mode therefore
# carries the identical rulebook hosts and the identical Chromium binary
# binding; what safe mode withholds is the mandate, not the network. There is no
# wildcard host and no other network client in this sandbox.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
    - /opt
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /run/openshell-browser
    - /var/lib/openshell-browser
landlock:
  compatibility: best_effort
process:
  run_as_user: 2000
  run_as_group: 2000
network_policies:
  browser_sites:
    name: browser-sites
    endpoints:
      - host: assets.xingcdn.com
        port: 443
        enforcement: enforce
      - host: cdn.freelance.de
        port: 443
        enforcement: enforce
      - host: cdn.freelancermap.de
        port: 443
        enforcement: enforce
      - host: cdn.gulp.de
        port: 443
        enforcement: enforce
      - host: dam.malt.com
        port: 443
        enforcement: enforce
      - host: freelance.de
        port: 443
        enforcement: enforce
      - host: freelancermap.com
        port: 443
        enforcement: enforce
      - host: freelancermap.de
        port: 443
        enforcement: enforce
      - host: gulp.de
        port: 443
        enforcement: enforce
      - host: linkedin.com
        port: 443
        enforcement: enforce
      - host: malt.com
        port: 443
        enforcement: enforce
      - host: malt.de
        port: 443
        enforcement: enforce
      - host: media.licdn.com
        port: 443
        enforcement: enforce
      - host: static.licdn.com
        port: 443
        enforcement: enforce
      - host: www.freelance.de
        port: 443
        enforcement: enforce
      - host: www.freelancermap.com
        port: 443
        enforcement: enforce
      - host: www.freelancermap.de
        port: 443
        enforcement: enforce
      - host: www.gulp.de
        port: 443
        enforcement: enforce
      - host: www.linkedin.com
        port: 443
        enforcement: enforce
      - host: www.malt.com
        port: 443
        enforcement: enforce
      - host: www.malt.de
        port: 443
        enforcement: enforce
      - host: www.xing.com
        port: 443
        enforcement: enforce
      - host: xing.com
        port: 443
        enforcement: enforce
    # OpenShell v0.0.86 enforces binary identity: an endpoint above is only
    # reachable by the pinned Chromium executable of the repository-owned
    # browser image. No other process in this sandbox has egress at all.
    binaries:
      - path: /opt/openshell-browser/browsers/chromium-1228/chrome-linux64/chrome
