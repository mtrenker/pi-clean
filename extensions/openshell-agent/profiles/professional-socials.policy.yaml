version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log, /opt]
  read_write: [/sandbox, /tmp, /dev/null, /var/lib/openshell-browser, /run/openshell-browser]

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

# The professional-socials worker sandbox has exactly the same deny-first egress
# as the safe authenticated-browser worker: only the image-owned Codex relay.
# The worker never reaches a professional-social site itself; every browser
# action is bridged by the trusted host and re-authorized by the controller.
network_policies:
  codex_relay:
    name: codex-relay
    endpoints:
      - host: chatgpt.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /backend-api/codex/responses
    binaries:
      - path: /opt/openshell-agent/relay-node
