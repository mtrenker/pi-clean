<title>Feed</title>
<main>
  <h1>Feed</h1>
  <button id="open-composer" type="button">Start a post</button>
  <section role="dialog" aria-label="Create a post" id="composer" hidden>
    <div id="post-body" contenteditable="true" aria-label="Post text"></div>
    <input id="attachment" name="attachment" type="file" />
    <button id="publish" type="button">Publish</button>
  </section>
  <p id="published"></p>
</main>
<script>
  document.getElementById("open-composer").addEventListener("click", () => {
    document.getElementById("composer").hidden = false;
  });
  document.getElementById("publish").addEventListener("click", () => {
    document.getElementById("composer").hidden = true;
    document.getElementById("published").textContent = document.getElementById("post-body").innerText;
    // Single-page publish that only rewrites the URL, like a real feed.
    history.pushState({}, "", "/feed/update/urn:li:activity:314159");
  });
</script>
