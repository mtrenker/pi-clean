name: Feature request
description: Propose a new capability or behavior
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Who needs this, what should they be able to do, and why? A short explanation is enough.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Link supporting context or rejected alternatives only when they change the work. Do not repeat the outcome.
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      placeholder: |
        In scope:
        - ...

        Not in scope:
        - ...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Observable behavior one
        - [ ] Required validation is documented and passes
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Link blockers and describe compatibility, security, or migration concerns.
